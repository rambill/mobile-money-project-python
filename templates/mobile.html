<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Money</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .balance-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 30px;
        }

        .balance-label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .balance-amount {
            font-size: 42px;
            font-weight: bold;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 10px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(56, 239, 125, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(235, 51, 73, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .message {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .message-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .hidden {
            display: none;
        }

        .server-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .server-info strong {
            color: #667eea;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Screen -->
        <div id="loginScreen" class="card">
            <h1>📱 Mobile Money</h1>
            <p class="subtitle">Distributed Mobile Money System</p>

            <div id="message"></div>

            <div class="input-group">
                <label>Phone Number</label>
                <input type="tel" id="loginPhone" placeholder="0759016809" maxlength="10">
            </div>

            <div class="input-group">
                <label>PIN</label>
                <input type="password" id="loginPin" placeholder="Enter 4-digit PIN" maxlength="4">
            </div>

            <div class="input-group">
                <label>Server</label>
                <select id="loginServer">
                    {% for server in servers %}
                    <option value="{{ server.id }}">{{ server.name }} ({{ server.latency|round(1) }}ms)</option>
                    {% endfor %}
                </select>
            </div>

            <button class="btn btn-primary" onclick="login()">Login</button>
            <button class="btn btn-secondary" onclick="showRegister()">Register New Account</button>
        </div>

        <!-- Register Screen -->
        <div id="registerScreen" class="card hidden">
            <h1>📝 Register</h1>
            <p class="subtitle">Create New Account</p>

            <div id="registerMessage"></div>

            <div class="input-group">
                <label>Phone Number</label>
                <input type="tel" id="registerPhone" placeholder="0759016809" maxlength="10">
            </div>

            <div class="input-group">
                <label>PIN (4 digits)</label>
                <input type="password" id="registerPin" placeholder="Enter 4-digit PIN" maxlength="4">
            </div>

            <div class="input-group">
                <label>Confirm PIN</label>
                <input type="password" id="registerPinConfirm" placeholder="Re-enter PIN" maxlength="4">
            </div>

            <div class="input-group">
                <label>Server</label>
                <select id="registerServer">
                    {% for server in servers %}
                    <option value="{{ server.id }}">{{ server.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <button class="btn btn-success" onclick="register()">Create Account</button>
            <button class="btn btn-secondary" onclick="showLogin()">Back to Login</button>
        </div>

        <!-- Main Screen -->
        <div id="mainScreen" class="card hidden">
            <h1>💰 My Account</h1>
            
            <div class="server-info">
                <strong>Connected:</strong> <span id="currentServer"></span><br>
                <strong>Phone:</strong> <span id="currentPhone"></span>
            </div>

            <div class="balance-display">
                <div class="balance-label">Current Balance</div>
                <div class="balance-amount">UGX <span id="balance">0</span></div>
            </div>

            <div id="mainMessage"></div>

            <div class="btn-grid">
                <button class="btn btn-success" onclick="showDeposit()">💵 Deposit</button>
                <button class="btn btn-danger" onclick="showWithdraw()">💸 Withdraw</button>
                <button class="btn btn-primary" onclick="showTransfer()">↔️ Transfer</button>
                <button class="btn btn-secondary" onclick="refreshBalance()">🔄 Refresh</button>
            </div>

            <button class="btn btn-secondary" onclick="logout()" style="margin-top: 20px;">Logout</button>
        </div>

        <!-- Deposit Screen -->
        <div id="depositScreen" class="card hidden">
            <h1>💵 Deposit Money</h1>

            <div id="depositMessage"></div>

            <div class="input-group">
                <label>Amount (UGX)</label>
                <input type="number" id="depositAmount" placeholder="Enter amount" min="1">
            </div>

            <button class="btn btn-success" onclick="deposit()">Deposit</button>
            <button class="btn btn-secondary" onclick="showMain()">Cancel</button>
        </div>

        <!-- Withdraw Screen -->
        <div id="withdrawScreen" class="card hidden">
            <h1>💸 Withdraw Money</h1>

            <div id="withdrawMessage"></div>

            <div class="input-group">
                <label>Amount (UGX)</label>
                <input type="number" id="withdrawAmount" placeholder="Enter amount" min="1">
            </div>

            <button class="btn btn-danger" onclick="withdraw()">Withdraw</button>
            <button class="btn btn-secondary" onclick="showMain()">Cancel</button>
        </div>

        <!-- Transfer Screen -->
        <div id="transferScreen" class="card hidden">
            <h1>↔️ Transfer Money</h1>

            <div id="transferMessage"></div>

            <div class="input-group">
                <label>To Phone Number</label>
                <input type="tel" id="transferPhone" placeholder="0759016809" maxlength="10">
            </div>

            <div class="input-group">
                <label>Amount (UGX)</label>
                <input type="number" id="transferAmount" placeholder="Enter amount" min="1">
            </div>

            <button class="btn btn-primary" onclick="transfer()">Transfer</button>
            <button class="btn btn-secondary" onclick="showMain()">Cancel</button>
        </div>
    </div>

    <script>
        // Show/Hide screens
        function showScreen(screenId) {
            document.querySelectorAll('.card').forEach(card => card.classList.add('hidden'));
            document.getElementById(screenId).classList.remove('hidden');
        }

        function showLogin() { showScreen('loginScreen'); }
        function showRegister() { showScreen('registerScreen'); }
        function showMain() { showScreen('mainScreen'); refreshBalance(); }
        function showDeposit() { showScreen('depositScreen'); }
        function showWithdraw() { showScreen('withdrawScreen'); }
        function showTransfer() { showScreen('transferScreen'); }

        // Show message
        function showMessage(elementId, message, isError = false) {
            const el = document.getElementById(elementId);
            el.innerHTML = `<div class="message ${isError ? 'message-error' : 'message-success'}">${message}</div>`;
            setTimeout(() => el.innerHTML = '', 5000);
        }

        // API calls
        async function login() {
            const phone = document.getElementById('loginPhone').value;
            const pin = document.getElementById('loginPin').value;
            const server_id = parseInt(document.getElementById('loginServer').value);

            if (!phone || !pin) {
                showMessage('message', 'Please enter phone and PIN', true);
                return;
            }

            const response = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({phone, pin, server_id})
            });

            const data = await response.json();

            if (data.success) {
                document.getElementById('currentPhone').textContent = phone;
                document.getElementById('currentServer').textContent = document.getElementById('loginServer').selectedOptions[0].text;
                document.getElementById('balance').textContent = data.balance.toLocaleString();
                showMain();
            } else {
                showMessage('message', data.error || 'Login failed', true);
            }
        }

        async function register() {
            const phone = document.getElementById('registerPhone').value;
            const pin = document.getElementById('registerPin').value;
            const pinConfirm = document.getElementById('registerPinConfirm').value;
            const server_id = parseInt(document.getElementById('registerServer').value);

            if (!phone || !pin) {
                showMessage('registerMessage', 'Please enter phone and PIN', true);
                return;
            }

            if (pin !== pinConfirm) {
                showMessage('registerMessage', 'PINs do not match', true);
                return;
            }

            if (pin.length !== 4) {
                showMessage('registerMessage', 'PIN must be 4 digits', true);
                return;
            }

            const response = await fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({phone, pin, server_id})
            });

            const data = await response.json();

            if (data.success) {
                showMessage('registerMessage', 'Account created! Logging in...');
                setTimeout(() => {
                    document.getElementById('loginPhone').value = phone;
                    document.getElementById('loginPin').value = pin;
                    document.getElementById('loginServer').value = server_id;
                    showLogin();
                }, 2000);
            } else {
                showMessage('registerMessage', data.error || 'Registration failed', true);
            }
        }

        async function refreshBalance() {
            const response = await fetch('/api/balance');
            const data = await response.json();

            if (data.success) {
                document.getElementById('balance').textContent = data.balance.toLocaleString();
            }
        }

        async function deposit() {
            const amount = parseFloat(document.getElementById('depositAmount').value);

            if (!amount || amount <= 0) {
                showMessage('depositMessage', 'Please enter valid amount', true);
                return;
            }

            const response = await fetch('/api/deposit', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({amount})
            });

            const data = await response.json();

            if (data.success) {
                showMessage('depositMessage', `Deposited UGX ${amount.toLocaleString()}`);
                setTimeout(() => {
                    document.getElementById('depositAmount').value = '';
                    showMain();
                }, 2000);
            } else {
                showMessage('depositMessage', data.error || 'Deposit failed', true);
            }
        }

        async function withdraw() {
            const amount = parseFloat(document.getElementById('withdrawAmount').value);

            if (!amount || amount <= 0) {
                showMessage('withdrawMessage', 'Please enter valid amount', true);
                return;
            }

            const response = await fetch('/api/withdraw', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({amount})
            });

            const data = await response.json();

            if (data.success) {
                showMessage('withdrawMessage', `Withdrawn UGX ${amount.toLocaleString()}`);
                setTimeout(() => {
                    document.getElementById('withdrawAmount').value = '';
                    showMain();
                }, 2000);
            } else {
                showMessage('withdrawMessage', data.error || 'Withdrawal failed', true);
            }
        }

        async function transfer() {
            const to_phone = document.getElementById('transferPhone').value;
            const amount = parseFloat(document.getElementById('transferAmount').value);

            if (!to_phone || !amount || amount <= 0) {
                showMessage('transferMessage', 'Please enter phone and amount', true);
                return;
            }

            const response = await fetch('/api/transfer', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({to_phone, amount})
            });

            const data = await response.json();

            if (data.success) {
                showMessage('transferMessage', `Transferred UGX ${amount.toLocaleString()} to ${to_phone}`);
                setTimeout(() => {
                    document.getElementById('transferPhone').value = '';
                    document.getElementById('transferAmount').value = '';
                    showMain();
                }, 2000);
            } else {
                showMessage('transferMessage', data.error || 'Transfer failed', true);
            }
        }

        async function logout() {
            await fetch('/api/logout', {method: 'POST'});
            showLogin();
        }
    </script>
</body>
</html>
